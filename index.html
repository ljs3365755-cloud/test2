<!DOCTYPE html>
<html>
<head>
    <title>소리 나는 이미지 바꾸기</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        img { cursor: pointer; width: 300px; transition: transform 0.1s; }
        img:active { transform: scale(0.95); } /* 클릭할 때 살짝 눌리는 효과 */
    </style>
</head>
<body>

    <img id="stickman" src="smile.jpg" alt="스틱맨" onclick="changeFace()">

    <script>
        // 소리 파일 불러오기
        const effectSound = new Audio('ddung.mp3'); 

        function changeFace() {
            const img = document.getElementById('stickman');
            
            // 1. 소리 재생
            effectSound.currentTime = 0; // 연속 클릭 시 소리가 끊기지 않고 처음부터 나오게 함
            effectSound.play();

            // 2. 이미지 교체
            if (img.src.match("smile.jpg")) {
                img.src = "angry.jpg";
            } else {
                img.src = "smile.jpg";
            }
        }
    </script>

</body>
</html>
