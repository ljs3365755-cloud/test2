<!DOCTYPE html>
<html>
<head>
    <title>스틱맨 옷 입히기</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; user-select: none; }
        .game-container { display: flex; align-items: center; gap: 30px; }
        
        .closet { width: 150px; height: 300px; border: 2px dashed #aaa; display: flex; justify-content: center; align-items: center; border-radius: 15px; }

        #character-area { 
            position: relative; 
            width: 400px; /* 얼굴 이미지 크기에 맞춰 넉넉하게 */
            height: 500px; 
            border: 2px solid #333; 
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .base-body { width: 100%; height: auto; }

        /* 공통 옷 스타일 */
        .cloth { cursor: grab; width: 100px; z-index: 10; -webkit-user-drag: none; }

        /* ★ 여기서 옷마다 사이즈와 위치를 미세 조정하세요 ★ */
        
        /* 1. 정장 (jj.png) 전용 스타일 */
        #cloth1.dressed {
            position: absolute;
            width: 220px;  /* 사이즈 조절 */
            top: 55%;      /* 위아래 위치 */
            left: 50%;     /* 좌우 위치 */
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* 2. 드레스 (dress.png) 전용 스타일 */
        #cloth2.dressed {
            position: absolute;
            width: 180px;  /* 사이즈 조절 */
            top: 58%;      /* 위아래 위치 */
            left: 50%;     /* 좌우 위치 */
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="closet" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="jj.png" id="cloth1" class="cloth" draggable="true" ondragstart="drag(event)">
    </div>

    <div id="character-area" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="face.jpg" class="base-body">
    </div>

    <div class="closet" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="dress.png" id="cloth2" class="cloth" draggable="true" ondragstart="drag(event)">
    </div>
</div>

<script>
    const sound = new Audio('ddung.mp3');

    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

    function drop(ev) {
        ev.preventDefault();
        const data = ev.dataTransfer.getData("text");
        const draggedElement = document.getElementById(data);
        
        if (ev.currentTarget.id === "character-area") {
            draggedElement.classList.add("dressed");
            ev.currentTarget.appendChild(draggedElement);
            // 옷 입힐 때 소리 나게 추가!
            sound.currentTime = 0;
            sound.play();
        } else {
            draggedElement.classList.remove("dressed");
            ev.currentTarget.appendChild(draggedElement);
        }
    }
</script>

</body>
</html>
