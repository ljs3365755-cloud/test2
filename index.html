<!DOCTYPE html>
<html>
<head>
    <title>스틱맨 옷 입히기 게임</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e0f7fa;
            font-family: sans-serif;
        }

        .game-container {
            display: flex;
            align-items: center;
            gap: 50px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* 옷 보관소 (왼쪽, 오른쪽) */
        .closet {
            width: 150px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ccc;
            border-radius: 10px;
        }

        /* 가운데 캐릭터 영역 */
        #character-area {
            position: relative;
            width: 300px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #333;
            border-radius: 15px;
            overflow: hidden;
        }

        .base-body {
            width: 100%;
            height: auto;
            z-index: 1;
        }

        /* 드래그되는 옷 스타일 */
        .cloth {
            cursor: grab;
            width: 120px;
            z-index: 10;
        }

        /* 입혀진 옷의 위치 (중앙에 겹치게) */
        .dressed {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; /* 캐릭터 크기에 맞춰 조절 */
            pointer-events: none; /* 옷을 입힌 후에도 클릭 방해 안 되게 */
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="closet" id="left-closet" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="jj.png" id="cloth1" class="cloth" draggable="true" ondragstart="drag(event)">
    </div>

    <div id="character-area" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="face.jpg" class="base-body" alt="캐릭터">
        </div>

    <div class="closet" id="right-closet" ondrop="drop(event)" ondragover="allowDrop(event)">
        <img src="dress.png" id="cloth2" class="cloth" draggable="true" ondragstart="drag(event)">
    </div>
</div>

<script>
    function allowDrop(ev) {
        ev.preventDefault(); // 드롭을 허용하도록 기본 동작 막기
    }

    function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id); // 드래그하는 요소의 ID 저장
    }

    function drop(ev) {
        ev.preventDefault();
        const data = ev.dataTransfer.getData("text");
        const draggedElement = document.getElementById(data);
        
        // 만약 캐릭터 영역에 드롭했다면?
        if (ev.currentTarget.id === "character-area") {
            draggedElement.classList.add("dressed");
            ev.currentTarget.appendChild(draggedElement);
        } 
        // 다시 옷장으로 보낸다면?
        else if (ev.currentTarget.classList.contains("closet")) {
            draggedElement.classList.remove("dressed");
            ev.currentTarget.appendChild(draggedElement);
        }
    }
</script>

</body>
</html>
