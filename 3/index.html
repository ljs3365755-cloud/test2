<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬라임 키우기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="nameModal">
        <div class="modal-content">
            <h2>슬라임 이름을 지어주세요</h2>
            <input type="text" id="nameInput" placeholder="이름 입력">
            <br>
            <button id="nameConfirmBtn">시작하기</button>
        </div>
    </div>

    <div id="gameContainer">
        <div id="topInterface">
            <span id="slimeNameDisplay">내 슬라임</span>
            <div class="lv-text">Lv.<span id="lvlNum">1</span></div>
            <span id="expPlus">+1</span>
            <button id="resetBtn">슬라임 새로 키우기</button>
        </div>

        <canvas id="slimeCanvas"></canvas>

        <div class="status-container">
            <div class="bar-wrap">
                <span class="bar-label">🍗 배부름</span>
                <div class="bar-bg"><div id="fullBar" class="bar-fill" style="background: #ff9f43; width: 50%;"></div></div>
            </div>
            <div class="bar-wrap">
                <span class="bar-label">✨ 청결도</span>
                <div class="bar-bg"><div id="cleanBar" class="bar-fill" style="background: #48dbfb; width: 50%;"></div></div>
            </div>
            <div class="bar-wrap">
                <span class="bar-label">⭐ 경험치</span>
                <div class="bar-bg"><div id="expBar" class="bar-fill" style="background: #1dd1a1; width: 0%;"></div></div>
            </div>
        </div>

        <div class="controls">
            <button onclick="trigger('feed', 10, 0)">🍙</button>
            <button onclick="trigger('water', 5, 0)">💧</button>
            <button onclick="trigger('cookie', 20, 0)">🍪</button>
            <button onclick="trigger('bubbles', 0, 20)">🚿</button>
            <button onclick="trigger('ball', -10, -5, 10)">⚽</button>
            <button onclick="trigger('pat', 0, 0, 5)">✋</button>
        </div>
    </div>

    <audio id="soundShower" src="bubble-pop.mp3"></audio>
    <audio id="soundEat" src="ggd-yumyum.mp3"></audio>
    <audio id="soundSelect" src="squeaky.mp3"></audio>
    <audio id="soundPat" src="uiiiiiiii.mp3"></audio>
    <audio id="soundWhistle" src="whistle.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
