<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽셀 슬라임 키우기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="name-tag">
            <input type="text" id="slimeName" placeholder="슬라임 이름 입력..." maxlength="10">
        </div>
        
        <div class="game-area">
            <canvas id="slimeCanvas" width="200" height="200"></canvas>
            
            <div class="status-bars">
                <div class="status-item">
                    <div class="bar-container">
                        <div id="fullnessBar" class="bar fullness"></div>
                    </div>
                    <div class="label-icon">🍙</div>
                </div>
                <div class="status-item">
                    <div class="bar-container">
                        <div id="cleanBar" class="bar cleanliness"></div>
                    </div>
                    <div class="label-icon">🚿</div>
                </div>
            </div>
        </div>
        
        <div class="ui-area">
            <p id="statusMsg">슬라임을 돌봐주세요!</p>
            <div class="button-group">
                <button id="feedBtn">🍙</button>
                <button id="waterBtn">💧</button>
                <button id="cookieBtn">🍪</button>
                <button id="showerBtn">🚿</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
