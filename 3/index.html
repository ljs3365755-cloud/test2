<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보라색 슬라임 키우기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="name-tag">
            <input type="text" id="slimeName" placeholder="슬라임 이름 입력..." maxlength="10">
        </div>
        
        <canvas id="slimeCanvas" width="200" height="200"></canvas>
        
        <div class="ui-area">
            <p id="statusMsg">슬라임을 돌봐주세요!</p>
            <div class="button-group">
                <button id="feedBtn" title="삼각김밥">🍙</button>
                <button id="waterBtn" title="물">💧</button>
                <button id="cookieBtn" title="쿠키">🍪</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
