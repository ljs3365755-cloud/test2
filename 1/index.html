<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>옷입히기 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="side-panel left">
            <img src="hood.png" class="item" alt="hood">
            <img src="hood2.png" class="item" alt="hood2">
        </div>

        <div class="center-panel">
            <div class="human-box">
                <img src="human.png" id="main-human" alt="human">
            </div>
            <div class="bottom-panel">
                <img src="pants1.png" class="item" alt="pants1">
                <img src="pants2.png" class="item" alt="pants2">
                <img src="pants3.png" class="item" alt="pants3">
            </div>
        </div>

        <div class="side-panel right">
            <img src="shirt1.png" class="item" alt="shirt1">
            <img src="shirt2.png" class="item" alt="shirt2">
            <img src="shirt3.png" class="item" alt="shirt3">
            <img src="shirt4.png" class="item" alt="shirt4">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
