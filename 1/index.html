<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>옷입히기 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <div class="side-panel left">
        <img src="hood.png" class="item" alt="hood" draggable="true">
        <img src="hood2.png" class="item" alt="hood2" draggable="true">
    </div>

    <div class="center-panel">
        <div class="human-box" id="drop-target">
            <img src="human.png" id="main-human" alt="human">
            <img src="" id="wear-hood" class="layered-item" style="display:none;">
            <img src="" id="wear-shirt" class="layered-item" style="display:none;">
            <img src="" id="wear-pants" class="layered-item" style="display:none;">
        </div>
        
        <div class="bottom-panel">
            <img src="pants1.png" class="item" alt="pants1" draggable="true">
            <img src="pants2.png" class="item" alt="pants2" draggable="true">
        </div>
    </div>

    <div class="side-panel right">
        <img src="shirt1.png" class="item" alt="shirt1" draggable="true">
        <img src="shirt2.png" class="item" alt="shirt2" draggable="true">
    </div>
</div>
    <script src="script.js"></script>
</body>
