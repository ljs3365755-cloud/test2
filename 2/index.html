<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>짱구 꾸미기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="side-panel left">
            <img src="hat.png" class="item size-hat" alt="hat" draggable="true">
            <img src="hat2.png" class="item size-hat2" alt="hat2" draggable="true">
            <img src="cafe.png" class="item size-cafe" alt="cafe" draggable="true">
        </div>

        <div class="center-panel">
            <img src="zzanggu.png" id="main-zzanggu" alt="zzanggu">
        </div>

        <div class="side-panel right">
            <img src="pin1.png" class="item size-pin" alt="pin1" draggable="true">
            <img src="pin2.png" class="item size-pin" alt="pin2" draggable="true">
            <img src="pin3.png" class="item size-pin" alt="pin3" draggable="true">
            <img src="reborn1.png" class="item size-ribbon" alt="reborn1" draggable="true">
            <img src="reborn2.png" class="item size-ribbon" alt="reborn2" draggable="true">
            <img src="fur.png" class="item size-fur" alt="fur" draggable="true">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
