<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>짱구 꾸미기 줄여서 짱꾸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <div class="side-panel left">
            <img src="hat.png" class="item" alt="hat" draggable="true">
            <img src="hat2.png" class="item" alt="hat2" draggable="true">
            <img src="cafe.png" class="item" alt="cafe" draggable="true">
        </div>

      <div class="center-panel">
    <div class="zzanggu-box" id="drop-target">
        <img src="zzanggu.png" id="main-zzanggu" alt="zzanggu">
        
        <img src="" id="wear-head" class="layered-item head-part">
        <img src="" id="wear-body" class="layered-item body-part">
        <img src="" id="wear-acc" class="layered-item acc-part">
    </div>
</div>

        <div class="side-panel right">
            <img src="pin1.png" class="item" alt="pin1" draggable="true">
            <img src="pin2.png" class="item" alt="pin2" draggable="true">
            <img src="pin3.png" class="item" alt="pin3" draggable="true">
            <img src="reborn1.png" class="item" alt="reborn1" draggable="true">
            <img src="reborn2.png" class="item" alt="reborn2" draggable="true">
            <img src="fur.png" class="item" alt="fur" draggable="true">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
